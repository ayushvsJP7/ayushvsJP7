<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Ayush loves ANA">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2353"/>
      <stop offset="0.55" stop-color="#13448F"/>
      <stop offset="1" stop-color="#2A7DE1"/>
    </linearGradient>
    <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B8B"/>
      <stop offset="1" stop-color="#E8264F"/>
    </linearGradient>
    <path id="heart" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    <path id="plane" d="M-14,-2 L6,-2 L14,-6 L18,-6 L13,0 L18,6 L14,6 L6,2 L-14,2 L-18,6 L-21,6 L-18,0 L-21,-6 L-18,-6 Z M-2,-2 L-8,-12 L-3,-12 L6,-2 Z M-2,2 L-8,12 L-3,12 L6,2 Z"/>
    <path id="route" d="M150,262 C 330,226 570,226 750,262"/>
  </defs>

  <rect width="900" height="300" rx="26" fill="url(#sky)"/>

  <!-- soft clouds -->
  <g fill="#FFFFFF" opacity="0.08">
    <ellipse cx="110" cy="70" rx="90" ry="26"/>
    <ellipse cx="170" cy="56" rx="60" ry="22"/>
    <ellipse cx="780" cy="90" rx="100" ry="28"/>
    <ellipse cx="720" cy="74" rx="58" ry="20"/>
  </g>

  <!-- little twinkles -->
  <g fill="#BFE0FF">
    <circle cx="60" cy="200" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="40" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="34" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- top label -->
  <text x="450" y="58" text-anchor="middle" fill="#9FD0FF" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5">AY2026 · INTERNSHIP · THANK YOU</text>

  <!-- main line: Ayush ♥ ANA -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="82" fill="#FFFFFF">
    <text x="392" y="150" text-anchor="end">Ayush</text>
    <text x="508" y="150" text-anchor="start">ANA</text>
  </g>
  <g transform="translate(450,122)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1;1.12;1" keyTimes="0;0.15;0.3;0.45;1" dur="1.4s" repeatCount="indefinite"/>
      <use href="#heart" transform="translate(-30,-31) scale(2.5)" fill="url(#heartFill)"/>
    </g>
  </g>

  <text x="450" y="186" text-anchor="middle" fill="#DCEBFF" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1">Ayush loves ANA</text>

  <!-- flight route AMD → HND -->
  <use href="#route" fill="none" stroke="#9FD0FF" stroke-width="2" stroke-dasharray="6 8" opacity="0.7"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#9FD0FF" letter-spacing="2">
    <text x="150" y="288" text-anchor="middle">AMD</text>
    <text x="750" y="288" text-anchor="middle">HND</text>
  </g>
  <circle cx="150" cy="262" r="5" fill="#9FD0FF"/>
  <circle cx="750" cy="262" r="5" fill="#9FD0FF"/>
  <use href="#plane" fill="#FFFFFF">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </use>

  <text x="450" y="214" text-anchor="middle" fill="#FFFFFF" opacity="0.85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2">AYUSH VARDHAN SINGH</text>
</svg>
