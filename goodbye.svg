<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="A boy with glasses waving bye bye, with a heart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#FFF0F4"/>
    </linearGradient>
    <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B8B"/>
      <stop offset="1" stop-color="#E8264F"/>
    </linearGradient>
    <path id="heart" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </defs>

  <rect width="900" height="380" rx="26" fill="url(#bg)"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="90" cy="70" rx="46" ry="16"/><ellipse cx="120" cy="60" rx="30" ry="14"/>
    <ellipse cx="820" cy="300" rx="50" ry="16"/><ellipse cx="790" cy="290" rx="30" ry="13"/>
  </g>

  <!-- ===== BOY ===== -->
  <g id="boy">
    <!-- ground shadow -->
    <ellipse cx="230" cy="352" rx="78" ry="10" fill="#13448F" opacity="0.12"/>

    <!-- legs -->
    <rect x="200" y="290" width="26" height="56" rx="9" fill="#26324D"/>
    <rect x="234" y="290" width="26" height="56" rx="9" fill="#26324D"/>
    <!-- shoes -->
    <ellipse cx="211" cy="348" rx="19" ry="8" fill="#FFFFFF" stroke="#26324D" stroke-width="3"/>
    <ellipse cx="251" cy="348" rx="19" ry="8" fill="#FFFFFF" stroke="#26324D" stroke-width="3"/>

    <!-- resting arm (boy's right) -->
    <path d="M190,205 Q172,245 168,282" fill="none" stroke="#13448F" stroke-width="22" stroke-linecap="round"/>
    <circle cx="168" cy="290" r="12" fill="#F2C29C"/>

    <!-- torso / shirt -->
    <path d="M182,206 Q182,188 205,186 L255,186 Q278,188 278,206 L276,300 Q230,308 184,300 Z" fill="#13448F"/>
    <!-- collar -->
    <path d="M212,186 L230,206 L248,186 Z" fill="#FFFFFF"/>
    <!-- lanyard + ID badge -->
    <path d="M214,190 L226,246 M246,190 L234,246" stroke="#5FB4FF" stroke-width="3" fill="none"/>
    <rect x="216" y="244" width="28" height="34" rx="4" fill="#FFFFFF"/>
    <rect x="216" y="244" width="28" height="8" rx="3" fill="#2A7DE1"/>
    <circle cx="230" cy="261" r="5" fill="#C9D6EA"/>
    <rect x="222" y="269" width="16" height="3" rx="1.5" fill="#C9D6EA"/>

    <!-- waving arm (boy's left) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 272 204; 16 272 204; -10 272 204" dur="0.9s" repeatCount="indefinite"/>
      <path d="M270,204 Q300,175 318,132" fill="none" stroke="#13448F" stroke-width="22" stroke-linecap="round"/>
      <!-- hand -->
      <g fill="#F2C29C">
        <circle cx="322" cy="118" r="14"/>
        <rect x="310" y="92" width="6" height="18" rx="3" transform="rotate(-12 313 101)"/>
        <rect x="317" y="88" width="6" height="20" rx="3" transform="rotate(-3 320 98)"/>
        <rect x="324" y="89" width="6" height="19" rx="3" transform="rotate(6 327 98)"/>
        <rect x="331" y="94" width="6" height="16" rx="3" transform="rotate(14 334 102)"/>
        <rect x="334" y="114" width="14" height="6" rx="3" transform="rotate(-25 334 117)"/>
      </g>
    </g>

    <!-- neck -->
    <rect x="221" y="170" width="18" height="20" rx="6" fill="#E5B48C"/>

    <!-- head -->
    <circle cx="178" cy="130" r="11" fill="#F2C29C"/>
    <circle cx="282" cy="130" r="11" fill="#F2C29C"/>
    <circle cx="230" cy="125" r="52" fill="#F2C29C"/>

    <!-- hair -->
    <path d="M177,124 Q172,70 228,66 Q288,64 284,124 Q278,96 254,92 Q240,104 214,100 Q192,100 177,124 Z" fill="#2B2B3A"/>
    <path d="M214,100 Q226,84 246,86" fill="none" stroke="#2B2B3A" stroke-width="6" stroke-linecap="round"/>

    <!-- eyebrows -->
    <path d="M198,112 Q208,106 218,111" fill="none" stroke="#2B2B3A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M242,111 Q252,106 262,112" fill="none" stroke="#2B2B3A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- eyes (blinking) -->
    <g fill="#1B1B2A">
      <ellipse cx="208" cy="131" rx="4" ry="4.5">
        <animate attributeName="ry" values="4.5;4.5;0.6;4.5;4.5" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="252" cy="131" rx="4" ry="4.5">
        <animate attributeName="ry" values="4.5;4.5;0.6;4.5;4.5" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- glasses (specs) -->
    <g fill="#FFFFFF" fill-opacity="0.18" stroke="#1B1B2A" stroke-width="3.5">
      <rect x="191" y="117" width="34" height="28" rx="11"/>
      <rect x="235" y="117" width="34" height="28" rx="11"/>
    </g>
    <path d="M225,128 Q230,124 235,128" fill="none" stroke="#1B1B2A" stroke-width="3.5"/>
    <path d="M191,126 L180,123 M269,126 L280,123" stroke="#1B1B2A" stroke-width="3.5" stroke-linecap="round"/>
    <!-- lens shine -->
    <path d="M197,124 L203,121" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M241,124 L247,121" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- blush -->
    <ellipse cx="198" cy="152" rx="9" ry="5" fill="#FF8FA3" opacity="0.5"/>
    <ellipse cx="262" cy="152" rx="9" ry="5" fill="#FF8FA3" opacity="0.5"/>

    <!-- big smile -->
    <path d="M214,154 Q230,172 246,154 Z" fill="#B6324D"/>
    <path d="M220,160 Q230,166 240,160" fill="none" stroke="#FF8FA3" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- floating little hearts from the waving hand -->
  <g fill="#FF5C7C">
    <use href="#heart" transform="translate(345,95) scale(0.8)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </use>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 6,-40" dur="3s" begin="1s" repeatCount="indefinite"/>
      <use href="#heart" transform="translate(360,70) scale(0.55)">
        <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </use>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -6,-36" dur="3s" begin="2s" repeatCount="indefinite"/>
      <use href="#heart" transform="translate(338,60) scale(0.45)">
        <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- ===== MESSAGE ===== -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="440" y="128" fill="#0B1F45" font-size="64" font-weight="800">Bye bye!</text>
    <text x="442" y="172" fill="#13448F" font-size="24" font-weight="700">Thank you for everything, ANA.</text>
    <text x="442" y="210" fill="#5B6B88" font-size="20" font-weight="600">またね！ See you again, everyone.</text>
    <text x="442" y="300" fill="#0B1F45" font-size="18" font-weight="700" letter-spacing="1">— Ayush Vardhan Singh</text>
  </g>

  <!-- big beating heart -->
  <g transform="translate(790,282)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1;1.12;1" keyTimes="0;0.15;0.3;0.45;1" dur="1.4s" repeatCount="indefinite"/>
      <use href="#heart" transform="translate(-36,-38) scale(3)" fill="url(#heartFill)"/>
    </g>
  </g>
</svg>
